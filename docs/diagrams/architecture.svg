<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="880" height="390" role="img" aria-label="Shiori high-level architecture">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="880" height="390" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Header -->
  <text x="28" y="34" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Shiori Architecture</text>
  <text x="28" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Self-hosted Node 24 + SQLite + Git MCP server (Docker / Coolify)</text>

  <!-- Left column: AI Clients -->
  <text x="28" y="84" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em">AI CLIENTS</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="28" y="96" width="166" height="50" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="44" y="118" fill="#f8fafc" font-size="13" font-weight="600">Muse</text>
    <text x="44" y="135" fill="#94a3b8" font-size="11">Remote MCP connector</text>

    <rect x="28" y="158" width="166" height="50" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="44" y="180" fill="#f8fafc" font-size="13" font-weight="600">Grok Bot</text>
    <text x="44" y="197" fill="#94a3b8" font-size="11">Remote MCP connector</text>

    <rect x="28" y="220" width="166" height="50" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="44" y="242" fill="#f8fafc" font-size="13" font-weight="600">Claude / ChatGPT</text>
    <text x="44" y="259" fill="#94a3b8" font-size="11">Web, desktop, mobile</text>

    <rect x="28" y="282" width="166" height="50" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="44" y="304" fill="#f8fafc" font-size="13" font-weight="600">Local Agents</text>
    <text x="44" y="321" fill="#94a3b8" font-size="11">Claude Code, CLI tools</text>
  </g>

  <!-- Connector arrows from clients to server -->
  <path d="M 194 214 L 288 214" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <rect x="206" y="185" width="70" height="22" rx="11" fill="#172554" stroke="#3b82f6"/>
  <text x="241" y="200" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5">HTTPS /mcp</text>
  <text x="241" y="232" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">OAuth 2.1</text>

  <!-- Main Server Container -->
  <rect x="294" y="72" width="386" height="292" rx="12" fill="#0b1220" stroke="#334155" stroke-width="1.5"/>
  <text x="312" y="96" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Shiori Container (Node 24)</text>
  <text x="662" y="96" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11">Traefik TLS</text>

  <!-- OAuth Gate -->
  <rect x="312" y="108" width="350" height="36" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="326" y="130" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">OAuth 2.1 Gate</text>
  <text x="432" y="130" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">GitHub owner check, PKCE S256, allowlist</text>

  <!-- Two layers side by side -->
  <rect x="312" y="156" width="169" height="106" rx="9" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="328" cy="174" r="4.5" fill="#34d399"/>
  <text x="340" y="178" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">Memory Tree</text>
  <text x="324" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Shared chronological</text>
  <text x="324" y="211" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">episodic timeline</text>
  <text x="324" y="233" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">wake, note, nap,</text>
  <text x="324" y="248" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">recall, zoom, forget</text>

  <rect x="493" y="156" width="169" height="106" rx="9" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="509" cy="174" r="4.5" fill="#60a5fa"/>
  <text x="521" y="178" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">Markdown Notes</text>
  <text x="505" y="196" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Git-versioned docs +</text>
  <text x="505" y="211" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">hybrid FTS5 + vectors</text>
  <text x="505" y="233" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">list, read, write,</text>
  <text x="505" y="248" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10">edit, search, move</text>

  <!-- Storage /data volume -->
  <rect x="312" y="276" width="350" height="72" rx="9" fill="#172033" stroke="#475569" stroke-dasharray="5 3"/>
  <text x="326" y="296" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700">/data (Persistent Volume)</text>
  <text x="326" y="316" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5">notes/      -> Git repo (every note edit is a commit)</text>
  <text x="326" y="334" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5">shiori.db   -> SQLite (FTS5, vectors, tree, OAuth)</text>

  <!-- Right column: External Services -->
  <text x="714" y="84" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="0.06em">EXTERNAL</text>

  <g font-family="system-ui, -apple-system, sans-serif">
    <rect x="714" y="102" width="142" height="54" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="728" y="124" fill="#f8fafc" font-size="12.5" font-weight="600">GitHub OAuth</text>
    <text x="728" y="142" fill="#94a3b8" font-size="10.5">Owner identity check</text>

    <rect x="714" y="182" width="142" height="62" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="728" y="204" fill="#f8fafc" font-size="12.5" font-weight="600">Embeddings API</text>
    <text x="728" y="221" fill="#94a3b8" font-size="10.5">OpenAI or Gemini</text>
    <text x="728" y="235" fill="#64748b" font-size="10">(optional)</text>

    <rect x="714" y="276" width="142" height="62" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="728" y="298" fill="#f8fafc" font-size="12.5" font-weight="600">Git Remote</text>
    <text x="728" y="315" fill="#94a3b8" font-size="10.5">Private repo backup</text>
    <text x="728" y="329" fill="#64748b" font-size="10">(optional)</text>
  </g>

  <!-- Right arrows -->
  <path d="M 662 126 L 710 126" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 662 212 L 710 212" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 662 310 L 710 310" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
</svg>
