<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 310" width="880" height="310" role="img" aria-label="Shiori binary-tree episodic memory">
  <rect width="880" height="310" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>

  <text x="28" y="34" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Binary-Tree Episodic Memory</text>
  <text x="28" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Recent memories stay verbatim; older pairs compress into power-of-2 summaries inside a fixed wake budget</text>

  <!-- Tree edges -->
  <g stroke="#475569" stroke-width="1.6" fill="none">
    <path d="M 245 112 L 135 152"/>
    <path d="M 245 112 L 355 152"/>
    <path d="M 135 190 L 80 226"/>
    <path d="M 135 190 L 190 226"/>
    <path d="M 355 190 L 300 226"/>
    <path d="M 355 190 L 410 226"/>
    <path d="M 575 190 L 520 226"/>
    <path d="M 575 190 L 630 226"/>
  </g>

  <!-- Level 2: #0-3 (INCLUDED IN WAKE) -->
  <rect x="155" y="72" width="180" height="40" rx="9" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="245" y="89" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">#0-3 (1-line summary)</text>
  <text x="245" y="104" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Returned by memory_wake</text>

  <!-- Level 1: #0-1 and #2-3 (zoomable) -->
  <rect x="65" y="152" width="140" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-dasharray="4 3"/>
  <text x="135" y="175" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">#0-1 (memory_zoom)</text>

  <rect x="285" y="152" width="140" height="38" rx="8" fill="#1e293b" stroke="#475569" stroke-dasharray="4 3"/>
  <text x="355" y="175" text-anchor="middle" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5">#2-3 (memory_zoom)</text>

  <!-- Level 1: #4-5 (INCLUDED IN WAKE) -->
  <rect x="495" y="150" width="160" height="40" rx="9" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <text x="575" y="167" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">#4-5 (summary)</text>
  <text x="575" y="182" text-anchor="middle" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Returned by memory_wake</text>

  <!-- Level 0: #0..#5 raw -->
  <g font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" text-anchor="middle">
    <rect x="35" y="226" width="90" height="34" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="80" y="247" fill="#94a3b8">#0 raw</text>

    <rect x="145" y="226" width="90" height="34" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="190" y="247" fill="#94a3b8">#1 raw</text>

    <rect x="255" y="226" width="90" height="34" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="300" y="247" fill="#94a3b8">#2 raw</text>

    <rect x="365" y="226" width="90" height="34" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="410" y="247" fill="#94a3b8">#3 raw</text>

    <rect x="475" y="226" width="90" height="34" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="520" y="247" fill="#94a3b8">#4 raw</text>

    <rect x="585" y="226" width="90" height="34" rx="7" fill="#1e293b" stroke="#334155"/>
    <text x="630" y="247" fill="#94a3b8">#5 raw</text>
  </g>

  <!-- Level 0: #6 newest (INCLUDED IN WAKE) -->
  <rect x="700" y="222" width="150" height="42" rx="9" fill="#172554" stroke="#60a5fa" stroke-width="2"/>
  <text x="775" y="240" text-anchor="middle" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700">#6 (verbatim)</text>
  <text x="775" y="255" text-anchor="middle" fill="#93c5fd" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">Newest in memory_wake</text>

  <!-- Footer legend -->
  <line x1="28" y1="278" x2="852" y2="278" stroke="#1e293b"/>
  <text x="28" y="297" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Older (more compressed)</text>
  <text x="440" y="297" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">memory_note appends raw entries; memory_nap merges completed pairs</text>
  <text x="852" y="297" text-anchor="end" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Newer (exact details)</text>
</svg>
