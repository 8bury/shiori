<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="Shiori note write and hybrid search pipelines">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="880" height="280" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="28" y="34" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">Note Writes &amp; Hybrid Search Pipelines</text>
  <text x="28" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Serialized Git commits feed an async indexer; search fuses SQLite FTS5 keywords with vector cosine similarity</text>

  <!-- Row 1: Write Path -->
  <text x="28" y="84" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">WRITE + INDEX PATH</text>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="28" y="96" width="142" height="52" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="99" y="119" fill="#f8fafc" font-size="12" font-weight="600">write / edit / move</text>
    <text x="99" y="136" fill="#94a3b8" font-size="10.5">Optimistic version</text>

    <line x1="170" y1="122" x2="202" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="208" y="96" width="150" height="52" rx="9" fill="#1e293b" stroke="#3b82f6"/>
    <text x="283" y="119" fill="#f8fafc" font-size="12" font-weight="600">Writer Mutex</text>
    <text x="283" y="136" fill="#93c5fd" font-size="10.5">Git commit in /data</text>

    <line x1="358" y1="122" x2="390" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="396" y="96" width="146" height="52" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="469" y="119" fill="#f8fafc" font-size="12" font-weight="600">IndexQueue</text>
    <text x="469" y="136" fill="#94a3b8" font-size="10.5">Retry backoff + DLQ</text>

    <line x1="542" y1="122" x2="574" y2="122" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="580" y="96" width="272" height="52" rx="9" fill="#172033" stroke="#475569"/>
    <text x="716" y="119" fill="#f8fafc" font-size="12" font-weight="600">SQLite Index (shiori.db)</text>
    <text x="716" y="136" fill="#94a3b8" font-size="10.5">chunks_fts (FTS5) + vectors + manifest</text>
  </g>

  <!-- Row 2: Search Path -->
  <text x="28" y="182" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.06em">HYBRID SEARCH PATH</text>

  <g font-family="system-ui, -apple-system, sans-serif" text-anchor="middle">
    <rect x="28" y="194" width="142" height="56" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="99" y="218" fill="#f8fafc" font-size="12" font-weight="600">search_notes</text>
    <text x="99" y="235" fill="#94a3b8" font-size="10.5">Query string</text>

    <path d="M 170 212 L 210 206" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M 170 232 L 210 238" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="216" y="188" width="214" height="28" rx="7" fill="#1e293b" stroke="#3b82f6"/>
    <text x="323" y="206" fill="#93c5fd" font-size="11" font-weight="600">SQLite FTS5 (BM25 prefix match)</text>

    <rect x="216" y="226" width="214" height="28" rx="7" fill="#1e293b" stroke="#10b981"/>
    <text x="323" y="244" fill="#6ee7b7" font-size="11" font-weight="600">API Embed + Cosine Similarity</text>

    <path d="M 430 202 L 474 216" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M 430 240 L 474 228" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="480" y="194" width="186" height="56" rx="9" fill="#064e3b" stroke="#34d399"/>
    <text x="573" y="218" fill="#f8fafc" font-size="12" font-weight="700">Reciprocal Rank Fusion</text>
    <text x="573" y="235" fill="#6ee7b7" font-size="10.5">Graceful single-side fallback</text>

    <line x1="666" y1="222" x2="698" y2="222" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

    <rect x="704" y="194" width="148" height="56" rx="9" fill="#1e293b" stroke="#334155"/>
    <text x="778" y="218" fill="#f8fafc" font-size="12" font-weight="600">Ranked Snippets</text>
    <text x="778" y="235" fill="#94a3b8" font-size="10.5">keyword / semantic / both</text>
  </g>
</svg>
